name: Release

# Publishing is a deliberate act: run this by hand from the main branch.
#
# The feature and the t3-dev helper are versioned separately, and each is
# released only when its own version is new:
#
#   feature   "version" in src/t3-server/devcontainer-feature.json
#             → ghcr.io/<owner>/<repo>/t3-server, git tag feature_t3-server_<version>
#   t3-dev    T3_DEV_VERSION in host/t3-dev
#             → GitHub release and git tag t3-dev-v<version>
#
# Bump the one that changed, run this, and the other is left alone. A feature
# release makes every project download the server again on its next rebuild;
# a t3-dev release does not.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      feature_version: ${{ steps.plan.outputs.feature_version }}
      feature_new: ${{ steps.plan.outputs.feature_new }}
      helper_version: ${{ steps.plan.outputs.helper_version }}
      helper_new: ${{ steps.plan.outputs.helper_new }}
    steps:
      # Actions are pinned to commits; a moved tag cannot change what publishes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the tags of earlier releases are compared below
      - name: Decide what to release
        id: plan
        run: |
          feature_version="$(jq -r .version src/t3-server/devcontainer-feature.json)"
          helper_version="$(bash host/t3-dev version)"
          helper_version="${helper_version#t3-dev }"
          for version in "$feature_version" "$helper_version"; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::'${version}' is not a MAJOR.MINOR.PATCH version"
              exit 1
            }
          done

          # A version that already has its tag is released. If its files have
          # changed since, the bump was forgotten: stop rather than skip it
          # silently or publish different content under a used number.
          # Documentation next to the feature's files is not part of what it
          # installs and does not call for a release.
          plan() { # <name> <tag> <path>
            if ! git rev-parse -q --verify "refs/tags/$2" >/dev/null; then
              echo "$1: $2 is new, releasing"
              echo "$1_new=true" >>"$GITHUB_OUTPUT"
            elif git diff --quiet "$2" HEAD -- "$3" ":(exclude)$3/*.md"; then
              echo "$1: $2 is already released and unchanged, skipping"
              echo "$1_new=false" >>"$GITHUB_OUTPUT"
            else
              echo "::error::$3 changed since $2 was released; bump its version"
              exit 1
            fi
          }
          plan feature "feature_t3-server_${feature_version}" src/t3-server
          plan helper "t3-dev-v${helper_version}" host/t3-dev
          echo "feature_version=${feature_version}" >>"$GITHUB_OUTPUT"
          echo "helper_version=${helper_version}" >>"$GITHUB_OUTPUT"
      # The tag is added by the next job instead, so that this third-party
      # action runs without write access to the repository.
      - name: Publish the feature to GHCR
        if: steps.plan.outputs.feature_new == 'true'
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
          disable-repo-tagging: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The only job that can write to the repository. It records the feature
  # release as a tag and publishes t3-dev, which is what 't3-dev update' and
  # the install instructions download, as a GitHub release with an artifact
  # attestation: a signed statement in a public transparency log that this
  # exact file came out of this workflow, which 'gh attestation verify' checks.
  tags:
    needs: feature
    if: needs.feature.outputs.feature_new == 'true' || needs.feature.outputs.helper_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and the release
      id-token: write # sign the attestation as this workflow
      attestations: write # store it
    env:
      FEATURE_VERSION: ${{ needs.feature.outputs.feature_version }}
      HELPER_VERSION: ${{ needs.feature.outputs.helper_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag the feature release
        if: needs.feature.outputs.feature_new == 'true'
        run: |
          tag="feature_t3-server_${FEATURE_VERSION}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
      - name: Collect t3-dev
        if: needs.feature.outputs.helper_new == 'true'
        run: |
          mkdir dist
          cp host/t3-dev dist/t3-dev
          (cd dist && sha256sum t3-dev >t3-dev.sha256)
      - name: Attest that t3-dev was built here
        if: needs.feature.outputs.helper_new == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/t3-dev
      - name: Release t3-dev
        if: needs.feature.outputs.helper_new == 'true'
        run: |
          gh release create "t3-dev-v${HELPER_VERSION}" dist/t3-dev dist/t3-dev.sha256 \
            --target "$GITHUB_SHA" \
            --title "t3-dev ${HELPER_VERSION}" \
            --notes "The \`t3-dev\` host helper, version ${HELPER_VERSION}. Update an installed one with \`t3-dev update\`. The dev container feature is versioned separately and published to \`ghcr.io/${GITHUB_REPOSITORY}/t3-server\`."
