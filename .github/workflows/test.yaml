name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck
        run: |
          shellcheck src/t3-server/install.sh src/t3-server/versions.sh \
            src/t3-server/scripts/entrypoint.sh src/t3-server/scripts/ssh-session \
            src/t3-server/scripts/t3-server host/t3-dev \
            src/t3-server/scripts/t3-pair test/t3-server/*.sh

  # The images and architectures below, together with test/t3-server/scenarios.json,
  # are the list of setups the feature is known to work on. Add one here or
  # there before claiming support for it.

  # Default options on dev container base images, which come with a non-root
  # remote user. On GitHub's runners that user's UID gets changed to the
  # runner's, which is the case that needs the data volume's owner repaired.
  defaults:
    name: defaults, ${{ matrix.baseImage }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04 # x64
          - ubuntu-24.04-arm # arm64
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu-24.04
          - mcr.microsoft.com/devcontainers/base:debian-12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build a container with the feature and run test.sh
        run: |
          npx --yes @devcontainers/cli@0.89.0 features test \
            --features t3-server \
            --base-image "${{ matrix.baseImage }}" \
            --skip-scenarios \
            .

  # Plain, slim, root-only and RHEL-family images, and the non-strict skip.
  scenarios:
    name: scenarios (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04 # x64
          - ubuntu-24.04-arm # arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run every scenario in test/t3-server/scenarios.json
        run: |
          npx --yes @devcontainers/cli@0.89.0 features test \
            --features t3-server \
            --skip-autogenerated \
            --skip-duplicated \
            .
