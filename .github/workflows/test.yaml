name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck
        run: |
          shellcheck src/t3-server/install.sh src/t3-server/versions.sh \
            src/t3-server/scripts/entrypoint.sh src/t3-server/scripts/ssh-session \
            src/t3-server/scripts/t3-server host/t3-dev \
            src/t3-server/scripts/t3-pair test/t3-server/*.sh

  # This matrix is the list of images and architectures the feature is known
  # to work on. Add an image here before claiming support for it.
  feature:
    name: ${{ matrix.baseImage }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04 # x64
          - ubuntu-24.04-arm # arm64
        baseImage:
          - mcr.microsoft.com/devcontainers/base:ubuntu-24.04
          - mcr.microsoft.com/devcontainers/base:debian-12
          - ubuntu:24.04
          - debian:12-slim
          - rockylinux:9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build a container with the feature and run its tests
        run: |
          npx --yes @devcontainers/cli@0.89.0 features test \
            --features t3-server \
            --base-image "${{ matrix.baseImage }}" \
            .
